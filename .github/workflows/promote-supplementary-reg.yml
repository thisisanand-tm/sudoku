name: Promote supplementary REG questions

on:
  push:
    branches: [main]
    paths:
      - scripts/promote_supplementary_reg.py
      - .github/workflows/promote-supplementary-reg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install validation dependency
        run: python -m pip install --quiet pypdf
      - name: Promote supplementary REG passes
        run: python scripts/promote_supplementary_reg.py
      - name: Syntax checks
        run: |
          node --check data/additional_validated_questions.js
          node --check data/questions.js
          node --check app.js
          node --check sw.js
      - name: Validate 501-question active bank
        run: |
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          const run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          run('data/open_questions.js'); run('data/nptel_questions.js');
          for(let i=1;i<=22;i++) run(`data/source_qa_${String(i).padStart(2,'0')}.js`);
          run('data/source_qa_compact_loader.js'); run('data/additional_validated_questions.js'); run('data/questions.js');
          const q=ctx.window.QUESTION_BANK, add=ctx.window.ADDITIONAL_VALIDATED_QUESTION_BANK, m=ctx.window.OPEN_BANK_MANIFEST;
          if(q.length!==501) throw new Error(`Expected 501, got ${q.length}`);
          if(add.length!==131) throw new Error(`Expected 131 additional, got ${add.length}`);
          if(m.activeQuestionCount!==501||m.additionalPrimaryValidatedCount!==131) throw new Error('Manifest count mismatch');
          if(new Set(q.map(x=>x.id)).size!==501) throw new Error('Duplicate IDs');
          const stems=q.map(x=>x.question.trim().toLowerCase().replace(/\s+/g,' '));
          if(new Set(stems).size!==501) throw new Error('Duplicate stems');
          if(q.some(x=>x.aiGenerated)) throw new Error('AI-authored stem found');
          for(const x of q){
            if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Bad options ${x.id}`);
            if(!Number.isInteger(x.answer)||x.answer<0||x.answer>3) throw new Error(`Bad answer ${x.id}`);
          }
          for(const x of add){
            if(!x.sourceUrl||!x.sourceLicense||!x.currentLawSource?.startsWith('https://www.sebi.gov.in/')) throw new Error(`Missing provenance ${x.id}`);
            if(x.choicesGenerated!=='assistant-generated-distractors') throw new Error(`Distractor provenance missing ${x.id}`);
          }
          for(const id of ['CAND-INDIAFINBENCH-0348','CAND-INDIAFINBENCH-0391']) if(add.some(x=>x.candidateId===id)) throw new Error(`Excluded item present ${id}`);
          console.log(JSON.stringify({active:q.length,additional:add.length,build:m.build},null,2));
          NODE
      - name: Validate supplementary promotion evidence
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          sup=[json.loads(x) for x in Path('audit/SUPPLEMENTARY_REG_VALIDATION.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          c=Counter(x['status'] for x in sup)
          assert len(sup)==48
          assert c['PASS_CURRENT_CONTEXT_EXPERT_REG']==37,c
          assert c['REJECT_CURRENT_TEXT_NOT_EVIDENCED']==11,c
          m=json.load(open('data/bank_manifest.json'))
          assert m['activeQuestionCount']==501
          assert m['additionalPrimaryValidatedCount']==131
          assert m['aiQuestionCount']==0
          idx=Path('index.html').read_text(); sw=Path('sw.js').read_text(); report=Path('audit/QUESTION_BANK_500_CLOSURE.md').read_text()
          assert 'using 501 validated sourced questions' in idx
          assert 'data/additional_validated_questions.js' in sw
          assert '501 questions' in report
          print('final bank',m['activeQuestionCount'],'supplementary pass',c['PASS_CURRENT_CONTEXT_EXPERT_REG'])
          PY
      - name: Commit 501-question bank
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/additional_validated_questions.js data/questions.js data/bank_manifest.json index.html sw.js README.md audit/QUESTION_BANK_500_CLOSURE.md
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Close sourced question bank at 501 validated questions'; git push origin HEAD:main; fi
