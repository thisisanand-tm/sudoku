name: Validate and promote additional SEBI questions

on:
  push:
    branches: [main]
    paths:
      - scripts/validate_promote_additional.py
      - .github/workflows/validate-promote-additional.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-promote:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install PDF parser
        run: python -m pip install --quiet pypdf

      - name: Validate against current SEBI primary sources and promote passes
        run: python scripts/validate_promote_additional.py

      - name: JavaScript syntax checks
        run: |
          node --check data/additional_validated_questions.js
          node --check data/questions.js
          node --check app.js
          node --check sw.js

      - name: Validate expanded active bank
        run: |
          node <<'NODE'
          const fs=require('fs');
          const vm=require('vm');
          const ctx={window:{}}; vm.createContext(ctx);
          const run=f=>vm.runInContext(fs.readFileSync(f,'utf8'),ctx,{filename:f});
          run('data/open_questions.js');
          run('data/nptel_questions.js');
          for(let i=1;i<=22;i++) run(`data/source_qa_${String(i).padStart(2,'0')}.js`);
          run('data/source_qa_compact_loader.js');
          run('data/additional_validated_questions.js');
          run('data/questions.js');
          const q=ctx.window.QUESTION_BANK;
          const m=ctx.window.OPEN_BANK_MANIFEST;
          const add=ctx.window.ADDITIONAL_VALIDATED_QUESTION_BANK;
          if(!Array.isArray(q)||!Array.isArray(add)) throw new Error('Missing banks');
          if(q.length!==m.activeQuestionCount) throw new Error(`Count mismatch ${q.length} vs ${m.activeQuestionCount}`);
          if(q.length<=370) throw new Error('No additional validated questions were promoted');
          if(add.length!==m.additionalPrimaryValidatedCount) throw new Error('Additional count mismatch');
          if(new Set(q.map(x=>x.id)).size!==q.length) throw new Error('Duplicate IDs');
          if(q.some(x=>x.aiGenerated)) throw new Error('AI-authored stem flag found');
          for(const x of q){
            if(!Array.isArray(x.options)||x.options.length!==4||new Set(x.options).size!==4) throw new Error(`Bad options ${x.id}`);
            if(!Number.isInteger(x.answer)||x.answer<0||x.answer>3) throw new Error(`Bad answer ${x.id}`);
          }
          for(const x of add){
            if(!x.currentLawSource?.startsWith('https://www.sebi.gov.in/')) throw new Error(`No SEBI primary source ${x.id}`);
            if(x.validationRequired!==false||x.needsCurrentnessReview!==false) throw new Error(`Validation flags wrong ${x.id}`);
            if(x.choicesGenerated!=='assistant-generated-distractors') throw new Error(`Distractor label missing ${x.id}`);
          }
          console.log(JSON.stringify({total:q.length,additional:add.length,manifest:m.build},null,2));
          NODE

      - name: Validate audit and PWA wiring
        run: |
          python - <<'PY'
          import json,re
          from pathlib import Path
          m=json.load(open('data/bank_manifest.json'))
          assert m['activeQuestionCount']>370
          assert m['additionalPrimaryValidatedCount']>0
          assert m['aiQuestionCount']==0
          report=Path('audit/ADDITIONAL_VALIDATION_REPORT.md').read_text()
          assert 'current-law validation' in report.lower()
          assert 'PASS_PRIMARY_SOURCE_EXTRACTIVE' in report
          idx=Path('index.html').read_text()
          sw=Path('sw.js').read_text()
          assert 'data/additional_validated_questions.js' in idx
          assert 'data/additional_validated_questions.js' in sw
          assert f"using {m['activeQuestionCount']} validated sourced questions" in idx
          print('validated total',m['activeQuestionCount'],'additional',m['additionalPrimaryValidatedCount'])
          PY

      - name: Commit validated promotion
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/additional_validated_questions.js data/questions.js data/bank_manifest.json index.html sw.js README.md SOURCES.md QUESTION_BANK_LICENSE.md audit/ADDITIONAL_VALIDATION_RESULTS.jsonl audit/ADDITIONAL_VALIDATION_REPORT.md
          if git diff --cached --quiet; then
            echo 'No promotion changes to commit.'
          else
            git commit -m 'Promote current-SEBI-validated source questions'
            git push origin HEAD:main
          fi
