name: Export validation audit

on:
  push:
    branches:
      - audit-question-validation-2026-09-16
    paths:
      - .github/workflows/export-validation-audit.yml

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: audit-question-validation-2026-09-16
      - name: Export validation-required questions
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          src = Path('data/open_questions.js').read_text(encoding='utf-8')
          m = re.search(r'window\.OPEN_QUESTION_BANK = (\[.*\]);\s*window\.OPEN_BANK_MANIFEST', src, re.S)
          if not m:
              raise SystemExit('question bank not found')
          bank = json.loads(m.group(1))
          flagged = [q for q in bank if q.get('validationRequired')]
          if len(flagged) != 88:
              raise SystemExit(f'expected 88 flagged questions, found {len(flagged)}')

          out = Path('audit')
          out.mkdir(exist_ok=True)
          (out / 'validation_questions.json').write_text(
              json.dumps(flagged, ensure_ascii=False, indent=2) + '\n', encoding='utf-8'
          )

          lines = ['# Validation-required question export', '', f'Total: **{len(flagged)}**', '']
          for i, q in enumerate(flagged, 1):
              answer = q['options'][q['answer']] if isinstance(q.get('answer'), int) and q['answer'] < len(q.get('options', [])) else str(q.get('answer'))
              lines += [
                  f'## {i}. {q["id"]}',
                  '',
                  f'- Category: {q.get("category")}',
                  f'- Difficulty: {q.get("difficulty")}',
                  f'- Question: {q.get("question")}',
                  f'- Source-marked answer: {answer}',
                  f'- Audit reasons: {q.get("auditReasons")}',
                  f'- Quality issues: {q.get("qualityIssues")}',
                  ''
              ]
          (out / 'validation_questions.md').write_text('\n'.join(lines), encoding='utf-8')
          PY
      - name: Commit audit export
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add audit/validation_questions.json audit/validation_questions.md
          git commit -m "Export validation-required question audit" || exit 0
          git push origin HEAD:audit-question-validation-2026-09-16
