name: Add practice resources

on:
  push:
    branches:
      - add-practice-resources-2026-09-16
    paths:
      - data/practice_resources.js
      - scripts/add_practice_resources.py
      - .github/workflows/add-practice-resources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-practice-resources-2026-09-16
          fetch-depth: 0

      - name: Apply update
        run: python scripts/add_practice_resources.py

      - name: Syntax check
        run: |
          node --check app.js
          node --check data/practice_resources.js
          node --check sw.js

      - name: Validate practice links and mock sampler
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          app=Path('app.js').read_text()
          idx=Path('index.html').read_text()
          css=Path('styles.css').read_text()
          sw=Path('sw.js').read_text()
          res=Path('data/practice_resources.js').read_text()
          assert 'source_qa_converted_mcq' in app
          assert 'function practiceResourcesMarkup()' in app
          assert '${practiceResourcesMarkup()}' in app
          assert 'data/practice_resources.js' in idx
          assert 'data/practice_resources.js' in sw
          assert 'External practice resources' in css
          urls=re.findall(r"url:\s*'([^']+)'",res)
          assert len(urls)==7, urls
          assert any('independentdirectorsdatabank.in/self_assessment' in u for u in urls)
          assert any('open-exam-prep.com' in u for u in urls)
          assert any('testbook.com' in u for u in urls)
          assert any('importantmcq.com' in u for u in urls)
          print('practice resources:', len(urls))
          PY

      - name: Preserve V9 question bank counts
        run: |
          python - <<'PY'
          from pathlib import Path
          import json,re
          text=Path('data/bank_manifest.json').read_text()
          m=json.loads(text)
          assert m['activeQuestionCount']==370
          assert m['sourceQaConvertedCount']==245
          assert m['aiQuestionCount']==0
          print('bank manifest preserved')
          PY

      - name: Commit update
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add app.js index.html styles.css sw.js README.md data/practice_resources.js scripts/add_practice_resources.py
          if git diff --cached --quiet; then
            echo 'No changes to commit'
          else
            git commit -m 'Add external practice resources and include all validated questions in mocks'
            git push origin HEAD:add-practice-resources-2026-09-16
          fi
