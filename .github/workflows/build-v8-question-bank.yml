name: Build V8 validated sourced bank

on:
  push:
    branches:
      - question-bank-v8-validated-sourced
    paths:
      - .github/workflows/build-v8-question-bank.yml
      - scripts/apply_v8_question_bank.py

permissions:
  contents: write

jobs:
  build-and-validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: question-bank-v8-validated-sourced

      - name: Build validated source-only bank
        run: python scripts/apply_v8_question_bank.py

      - name: Validate JavaScript syntax
        run: |
          node --check data/open_questions.js
          node --check data/nptel_questions.js
          node --check data/questions.js
          node --check data/openbank-loader.js
          node --check app.js
          node --check sw.js

      - name: Validate bank invariants
        run: |
          python - <<'PY'
          import json, re
          from pathlib import Path

          def parse_array(path, name):
              text = Path(path).read_text(encoding='utf-8')
              m = re.search(rf'window\.{name} = (\[.*?\]);', text, re.S)
              if not m:
                  raise SystemExit(f'Could not parse {name} from {path}')
              return json.loads(m.group(1))

          bhasha = parse_array('data/open_questions.js', 'OPEN_QUESTION_BANK')
          nptel = parse_array('data/nptel_questions.js', 'NPTEL_QUESTION_BANK')
          retired = json.loads(Path('data/retired_questions.json').read_text(encoding='utf-8'))
          manifest = json.loads(Path('data/bank_manifest.json').read_text(encoding='utf-8'))
          combined = bhasha + nptel

          assert len(bhasha) == 118, len(bhasha)
          assert len(nptel) == 7, len(nptel)
          assert len(combined) == 125, len(combined)
          assert len(retired) == 13, len(retired)
          assert manifest['preexistingCount'] == 125
          assert manifest['bhashaActiveCount'] == 118
          assert manifest['nptelImportedCount'] == 7
          assert manifest['retiredAfterValidationCount'] == 13
          assert manifest['validationRequiredCount'] == 0
          assert manifest['aiQuestionCount'] == 0
          assert all(not q.get('aiGenerated', False) for q in combined)
          assert all(not q.get('validationRequired', False) for q in combined)
          assert len({q['id'] for q in combined}) == 125
          retired_ids = {q['id'] for q in retired}
          active_ids = {q['id'] for q in combined}
          assert not (retired_ids & active_ids)
          assert all(len(q.get('options', [])) == 4 for q in combined)
          assert all(isinstance(q.get('answer'), int) and 0 <= q['answer'] < 4 for q in combined)
          assert 'data/nptel_questions.js' in Path('index.html').read_text(encoding='utf-8')
          assert "director-mock-v8-validated-sourced" in Path('sw.js').read_text(encoding='utf-8')
          print(json.dumps({
              'active': len(combined),
              'bhasha': len(bhasha),
              'nptel': len(nptel),
              'retired': len(retired),
              'ai': sum(bool(q.get('aiGenerated')) for q in combined),
              'validation_required': sum(bool(q.get('validationRequired')) for q in combined),
              'categories': manifest['categoryCounts'],
              'difficulty': manifest['difficultyCounts']
          }, ensure_ascii=False, indent=2))
          PY

      - name: Static smoke test
        run: |
          python -m http.server 8000 >/tmp/director_mock_http.log 2>&1 &
          server_pid=$!
          trap 'kill $server_pid || true' EXIT
          sleep 1
          curl --fail --silent --show-error http://127.0.0.1:8000/index.html | grep -q 'data/nptel_questions.js'
          curl --fail --silent --show-error http://127.0.0.1:8000/data/bank_manifest.json | grep -q 'V8-validated-sourced'
          curl --fail --silent --show-error http://127.0.0.1:8000/data/nptel_questions.js | grep -q 'NPTEL-TEC-2019-W1-Q1'

      - name: Commit generated V8 bank
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add data index.html sw.js README.md SOURCES.md QUESTION_BANK_LICENSE.md AUDIT_SUMMARY.md audit/NPTEL_INGEST_2026-09-16.md
          git commit -m "Build Director Mock India V8 validated sourced bank" || exit 0
          git push origin HEAD:question-bank-v8-validated-sourced
