name: Split held review candidates

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/split-held-review.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  split:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Split compact inventory
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          data=json.load(open('audit/HELD_DERIVED_INVENTORY.json',encoding='utf-8'))['items']
          for task in ('REG','NUM','TMP'):
              rows=[x for x in data if x.get('sourceTaskType')==task]
              # JSONL keeps each item independently retrievable by line number.
              Path(f'audit/HELD_{task}.jsonl').write_text(''.join(json.dumps(x,ensure_ascii=False,separators=(',',':'))+'\n' for x in rows),encoding='utf-8')
              print(task,len(rows))
          PY
      - name: Commit splits
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/HELD_REG.jsonl audit/HELD_NUM.jsonl audit/HELD_TMP.jsonl
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Split held candidates by reasoning task'; git push origin HEAD:main; fi
