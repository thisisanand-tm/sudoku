name: Extract additional source candidates

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/extract_additional_sources.py
      - .github/workflows/extract-additional-sources.yml

permissions:
  contents: write

jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Extract source candidates
        run: python scripts/extract_additional_sources.py
      - name: Validate active bank remains unchanged
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/bank_manifest.json'))
          assert m['activeQuestionCount']==370, m
          assert m['aiQuestionCount']==0, m
          c=json.load(open('data/candidates/candidate_manifest.json'))
          assert c['activeBankModified'] is False
          assert c['activeBankExpectedCount']==370
          assert c['aiAuthoredQuestionStemCount']==0
          print(json.dumps(c, indent=2))
          PY
      - name: Commit extraction results
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/candidates audit/ADDITIONAL_SOURCE_EXTRACTION.md
          if git diff --cached --quiet; then
            echo 'No extraction changes to commit.'
          else
            git commit -m 'Extract additional open-source question candidates'
            git push origin HEAD:main
          fi
