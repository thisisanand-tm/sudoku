name: Build direct validation inventory

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/direct-validation-inventory.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inventory:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build compact direct-review inventory
        run: |
          python - <<'PY'
          import json
          from collections import Counter, defaultdict
          from pathlib import Path

          src=Path('data/candidates/additional_source_candidates.jsonl')
          rows=[json.loads(x) for x in src.read_text(encoding='utf-8').splitlines() if x.strip()]
          direct=[x for x in rows if x.get('disposition')=='DIRECT_REVIEW']
          compact=[]
          for x in direct:
              compact.append({
                  'candidateId':x['candidateId'],
                  'sourceKey':x['sourceKey'],
                  'sourceItemId':x['sourceItemId'],
                  'sourceDetail':x.get('sourceDetail',''),
                  'examCategory':x.get('examCategory',''),
                  'difficulty':x.get('difficulty',''),
                  'question':x.get('question',''),
                  'answer':x.get('answer',''),
                  'sourceUrl':x.get('sourceUrl',''),
                  'license':x.get('license',''),
              })
          out=Path('audit/DIRECT_VALIDATION_INVENTORY.json')
          out.write_text(json.dumps({'count':len(compact),'items':compact},ensure_ascii=False,indent=2)+'\n',encoding='utf-8')

          c=Counter(x.get('sourceDetail','') for x in direct)
          lines=['# Direct validation inventory','',f'Total direct-review candidates: **{len(direct)}**','','## Source-detail groups']
          for k,v in c.most_common():
              lines.append(f'- {v} — {k}')
          Path('audit/DIRECT_VALIDATION_INVENTORY.md').write_text('\n'.join(lines)+'\n',encoding='utf-8')
          print('direct',len(direct),'groups',len(c))
          PY

      - name: Commit inventory
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/DIRECT_VALIDATION_INVENTORY.json audit/DIRECT_VALIDATION_INVENTORY.md
          if git diff --cached --quiet; then
            echo 'No changes'
          else
            git commit -m 'Build 160-item direct validation inventory'
            git push origin HEAD:main
          fi
