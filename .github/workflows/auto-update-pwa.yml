name: Auto-update PWA

on:
  push:
    branches: [add-practice-resources-2026-09-16]
    paths:
      - pwa-update.js
      - scripts/auto_update_pwa.py
      - .github/workflows/auto-update-pwa.yml

permissions:
  contents: write

jobs:
  validate-and-commit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-practice-resources-2026-09-16
          fetch-depth: 0
      - name: Apply PWA update patch
        run: python scripts/auto_update_pwa.py
      - name: Syntax checks
        run: |
          node --check pwa-update.js
          node --check sw.js
          node --check app.js
      - name: Validate automatic update wiring
        run: |
          grep -q 'pwa-update.js' index.html
          grep -q "updateViaCache: 'none'" pwa-update.js
          grep -q 'controllerchange' pwa-update.js
          grep -q 'window.location.reload' pwa-update.js
          grep -q 'registration.update' pwa-update.js
          grep -q "director-mock-v11-auto-update" sw.js
          grep -q "event.request.mode==='navigate'" sw.js
          grep -q "type==='SKIP_WAITING'" sw.js
      - name: Preserve question bank
        run: |
          python - <<'PY'
          import json
          m=json.load(open('data/bank_manifest.json'))
          assert m['activeQuestionCount']==370
          assert m['sourceQaConvertedCount']==245
          assert m['aiQuestionCount']==0
          print('Question bank preserved:',m['activeQuestionCount'])
          PY
      - name: Commit update
        run: |
          if git diff --quiet; then
            echo 'No generated changes to commit.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw.js README.md pwa-update.js scripts/auto_update_pwa.py
          git commit -m 'Automatically reload when a new PWA version is ready'
          git push origin HEAD:add-practice-resources-2026-09-16
