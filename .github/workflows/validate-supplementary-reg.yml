name: Validate supplementary REG candidates

on:
  push:
    branches: [main]
    paths:
      - scripts/validate_supplementary_reg.py
      - .github/workflows/validate-supplementary-reg.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - name: Install PDF parser
        run: python -m pip install --quiet pypdf
      - name: Validate supplementary REG candidates
        run: python scripts/validate_supplementary_reg.py
      - name: Validate report contract
        run: |
          python - <<'PY'
          import json
          from collections import Counter
          from pathlib import Path
          rows=[json.loads(x) for x in Path('audit/SUPPLEMENTARY_REG_VALIDATION.jsonl').read_text(encoding='utf-8').splitlines() if x.strip()]
          assert len(rows)==48
          assert all(x['sourceKey']=='INDIAFINBENCH' and x['sourceTaskType']=='REG' for x in rows)
          assert all(x.get('currentLawSource','').startswith('https://www.sebi.gov.in/') for x in rows)
          c=Counter(x['status'] for x in rows)
          print(dict(c))
          PY
      - name: Commit validation evidence
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add audit/SUPPLEMENTARY_REG_VALIDATION.jsonl audit/SUPPLEMENTARY_REG_VALIDATION.md
          if git diff --cached --quiet; then echo 'No changes'; else git commit -m 'Validate supplementary REG candidates against current SEBI sources'; git push origin HEAD:main; fi
